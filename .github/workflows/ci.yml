name: CI
on:
  push:
  pull_request:

# Rivet comes from the Racket Package Catalog (`raco pkg install rivet`),
# the standard downstream consumption per rivet docs/ci.md: every CI run and
# release builds against the same released Rivet, and rivet releases flow in
# automatically instead of drifting per app.
jobs:
  release-metadata:
    name: Release metadata (VERSION alignment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version alignment
        run: bash scripts/check-release-version.sh

  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
      - name: Install Rivet (catalog) and crypto
        run: |
          raco pkg install --auto --no-docs rivet
          # crypto backs the app updater (direct dependency), not rivet
          raco pkg install --auto --no-docs crypto
      - name: Domain core tests
        run: raco test racket/

  # SyncPilot is a Linux-only product: the GTK4 host is the only first-party
  # host, so CI compiles it for real (backend bundle + CMake host) and boots
  # it briefly under Xvfb. The embeddable Racket CS build is the expensive
  # part and is cached.
  linux-host:
    name: Linux host (GTK4 + WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@main

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsecret-1-dev \
            liblz4-dev \
            zlib1g-dev \
            libncurses-dev \
            xvfb

      - name: Install Rivet (catalog) and crypto
        run: |
          # Installed after the embeddable runtime so the catalog dependency
          # closure resolves against the minimal build — it ships no packages
          # of its own. crypto backs the app updater (direct dependency).
          raco pkg install --auto --no-docs rivet
          raco pkg install --auto --no-docs crypto

      - name: Build backend bundle and host
        run: |
          set -euo pipefail
          raco rivet doctor
          raco rivet build
          test -x .rivet/stage/RivetHost
          # The WebKitGTK dev package is installed, so the full-UI variant
          # (HAVE_WEBKIT) must be what got linked.
          ldd .rivet/stage/RivetHost | grep -qi webkit

      # Beyond the 5-second launch smoke: with a real rslsync binary present,
      # initialize must spawn the daemon (default autostart-daemon), the
      # daemon's Web UI must listen on 127.0.0.1:38889 (default settings),
      # and the backend's auth-injecting proxy (ephemeral port, owned by
      # RivetHost) must answer HTTP for /gui/. This exercises the whole
      # backend chain — manager, conf generation, proxy — end to end.
      - name: Integration smoke (real daemon + proxy)
        run: |
          set -euo pipefail
          # GitHub runners deny unprivileged network namespaces, which kills
          # WebKit's bubblewrap sandbox ("bwrap: loopback: Operation not
          # permitted") and aborts the process when the web view loads.
          # Real desktop sessions sandbox fine; CI runs without it.
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export GTK_A11Y=none
          bash scripts/install-rslsync.sh
          cd .rivet/stage
          cleanup() {
            # The embedded runtime ignores SIGTERM (rivet #120), so name-based
            # SIGKILL is the only reliable teardown; keep-daemon-on-exit
            # defaults to on, so rslsync must go too.
            pkill -9 -x RivetHost 2>/dev/null || true
            pkill -9 -x rslsync 2>/dev/null || true
          }
          trap cleanup EXIT
          xvfb-run -a ./RivetHost &
          ok=""
          for _ in $(seq 1 60); do
            sleep 1
            if pgrep -x rslsync >/dev/null 2>&1 \
               && ss -tln | grep -q '127.0.0.1:38889 '; then
              ok=1
              break
            fi
          done
          if [ -z "$ok" ]; then
            echo "rslsync did not come up with a listening Web UI in 60s" >&2
            exit 1
          fi
          # The proxy is the one listening socket owned by the host process.
          proxy_port="$(ss -tlnp 2>/dev/null | awk '/RivetHost/ {print $4}' \
            | sed 's/.*://' | head -1)"
          if [ -z "$proxy_port" ]; then
            echo "RivetHost has no listening proxy socket" >&2
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:${proxy_port}/gui/")"
          echo "proxy /gui/ answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "expected the auth-injecting proxy to answer 200" >&2
            exit 1
          fi

      # Package and verify run rivet's built-in launch smoke by default: the
      # packaged app must survive 5 seconds under a real (virtual) display.
      # On CI initialize fails with "rslsync not found", which shows the boot
      # page's error card — that is the expected state.
      - name: Package and verify (with launch smoke)
        run: |
          set -euo pipefail
          # rslsync is installed by the integration step above, so the smoke
          # now boots past the error card into the web view, where WebKit's
          # bwrap sandbox hits the runner's userns restriction (see the
          # integration step). Real desktop sessions sandbox fine.
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export GTK_A11Y=none
          xvfb-run -a bash -c 'set -euo pipefail; raco rivet package && raco rivet verify'
          test -x dist/syncpilot-linux-x64/RivetHost
