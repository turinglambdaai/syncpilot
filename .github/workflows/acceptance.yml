name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RIVET_PIN: b1d05950537f8679b2cfb48aded383c5162c288f

jobs:
  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@b1d05950537f8679b2cfb48aded383c5162c288f
      - name: Install native and pinned Racket dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11 libgtk-4-dev \
            libwebkitgtk-6.0-dev libjson-glib-dev libsecret-1-dev \
            python3-pyatspi weston xvfb
          raco pkg install --auto --no-docs \
            "https://github.com/turinglambdaai/rivet.git#${RIVET_PIN}"
          raco pkg install --auto --no-docs crypto
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncpilot-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn
