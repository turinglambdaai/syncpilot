name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Rivet is consumed as a tag-pinned Git source
# (`https://github.com/turinglambdaai/rivet.git#v0.11.0`) — the hold-back
# form rivet docs/ci.md prescribes for releases: catalog installation follows
# the catalog's moving checksum and has no version selector, so releases must
# not float on it.

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.11.0
      # Installed after the embeddable runtime so the dependency closure
      # resolves against the minimal build — it ships no packages of its
      # own. Tag-pinned Git source per rivet docs/ci.md. crypto backs the
      # app updater (direct dependency).
      - name: Install Rivet v0.11.0 and crypto
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#v0.11.0'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, WebKitGTK and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libwebkitgtk-6.0-dev libsecret-1-dev \
            libjson-glib-dev \
            liblz4-dev zlib1g-dev libncurses-dev \
            cmake ninja-build pkg-config file desktop-file-utils rpm \
            xvfb
      # The tag is the release's promise; VERSION / rivet.rktd / the
      # updater's embedded identity must all agree — and the CHANGELOG must
      # document the version — before anything is built.
      - name: Version preflight (VERSION == rivet.rktd == updater == tag == CHANGELOG)
        run: |
          set -euo pipefail
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          tag_version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${tag_version}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${tag_version}]' section" >&2
            exit 1
          }
      # tar.gz (the update payload) + deb + rpm + AppImage + portable zip
      # + SBOM
      # + notices, launch smoke included. APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool (fetched by rivet, checksum-pinned) run without FUSE;
      # the WebKit flags cover the smoke on the runner (see ci.yml — real
      # desktops sandbox fine).
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          GTK_A11Y: none
        run: xvfb-run -a raco rivet release --without-updates --development
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # rivet 0.6.1 names every installer in family form already
          # (deb says amd64 on this leg); only the SBOM and notices lack
          # the architecture.
          mv sbom.cdx.json "syncpilot-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "syncpilot-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in syncpilot-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/syncpilot-*

  publish:
    name: Publish
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet v0.11.0
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#v0.11.0'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sign the update feed and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv artifacts/linux-x64/* artifacts/linux-arm64/* dist/
          # The update feed keeps the 0.6.1 contract: one signed
          # update-stable.json whose artifacts are the per-arch tar.gz
          # payloads the updater downloads, signed with the long-lived
          # syncpilot-2026-10 key. rivet 0.6.1's built-in manifest points
          # at the portable zip instead, which the SyncPilot updater does
          # not consume. Missing secret → warn and publish without it.
          update_asset=""
          if [[ -n "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
            printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
            scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_DER"
            # gh release create resolves file args from their final working
            # directory (dist/), so the manifest rides under its bare name.
            update_asset="update-stable.json"
          else
            echo "::warning::UPDATE_ED25519_PRIVATE_KEY_B64 not set — release ships without update-stable.json"
          fi
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          cd dist
          for f in *.sha256; do [ -s "$f" ] || rm -f "$f"; done
          cat *.sha256 > SHA256SUMS
          # every file a sidecar or SHA256SUMS describes must ship too, so
          # `sha256sum -c SHA256SUMS` resolves against the release alone
          gh release create "$GITHUB_REF_NAME" \
            --title "SyncPilot ${VERSION}" \
            --notes-file /tmp/notes.md \
            *.tar.gz *.deb *.rpm *.AppImage *.zip \
            *.sbom.cdx.json *-THIRD_PARTY_NOTICES.txt \
            *.sha256 SHA256SUMS $update_asset
