name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Rivet is pinned: builds must be reproducible, and a framework commit is
# only bumped deliberately (it is the API the host compiles against —
# f37908f is the first commit with rivet::system::TrayIcon, needed by the
# Linux host's tray). To bump: point RIVET_PKG_SOURCE at the new commit,
# rebuild, and re-smoke.
env:
  RIVET_PKG_SOURCE: "https://github.com/turinglambdaai/rivet.git#f37908f"
jobs:
  linux-release:
    name: Linux x64 release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache embeddable Racket CS 9.3
        id: cache-racket-embed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
          save-always: true

      - name: Build Racket CS 9.3 from pinned source
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j4
          make install

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsecret-1-dev \
            liblz4-dev \
            zlib1g-dev \
            libncurses-dev \
            xvfb

      - name: Install rivet (upstream main) and crypto into the embed Racket
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/racket-embed/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          # net/url and openssl (needed by the rslsync installer's HTTPS
          # download) ship inside the minimal distribution; crypto is the
          # rivet/distribution dependency the online updater adds to the
          # backend closure.
          raco pkg install --auto --no-docs --skip-installed "${RIVET_PKG_SOURCE}"
          raco pkg install --auto --no-docs crypto

      # The tag is the release's promise; rivet.rktd is what the binary
      # reports. They must agree — and the CHANGELOG must document the
      # version — before anything is built.
      - name: Check tag matches the declared version and CHANGELOG
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/.*(version . "\([0-9][0-9.]*\)").*/\1/p' rivet.rktd)"
          if [ "$tag_version" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} but rivet.rktd declares ${declared}" >&2
            echo "bump rivet.rktd (and CHANGELOG.md) before tagging." >&2
            exit 1
          fi
          grep -q "^## \[${tag_version}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${tag_version}]' section" >&2
            exit 1
          }

      - name: Build backend bundle and host
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          embed_prefix="$RUNNER_TEMP/racket-embed"
          racket_include="$(dirname "$(find "$embed_prefix" -name chezscheme.h -print -quit)")"
          racket_library="$(find "$embed_prefix" -name 'libracketcs*.a' -print -quit)"
          petite_source="$(find "$embed_prefix" -name petite.boot -print -quit)"
          export RIVET_RACKET_INCLUDE="$racket_include"
          export RIVET_RACKET_LIB_DIR="$(dirname "$racket_library")"
          export RIVET_RACKET_LIBRARY="$racket_library"
          export RIVET_RACKET_BOOT_DIR="$(dirname "$petite_source")"
          raco rivet doctor
          raco rivet build
          test -x .rivet/stage/RivetHost
          ldd .rivet/stage/RivetHost | grep -qi webkit

      # `raco rivet release` = package + verify (with rivet's launch smoke)
      # + signed installer + SBOM + the Ed25519-signed update manifest.
      # --development skips production platform signing (none exists on
      # Linux; installer trust is the signed manifest + SHA-256), but the
      # update manifest still demands its own key. The smoke boots the real
      # web view, where WebKit's bwrap sandbox hits the runner's userns
      # restriction (see the CI workflow) — real desktops sandbox fine.
      - name: Package, verify and sign (rivet release)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/syncpilot/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: syncpilot-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          embed_prefix="$RUNNER_TEMP/racket-embed"
          racket_include="$(dirname "$(find "$embed_prefix" -name chezscheme.h -print -quit)")"
          racket_library="$(find "$embed_prefix" -name 'libracketcs*.a' -print -quit)"
          petite_source="$(find "$embed_prefix" -name petite.boot -print -quit)"
          export RIVET_RACKET_INCLUDE="$racket_include"
          export RIVET_RACKET_LIB_DIR="$(dirname "$racket_library")"
          export RIVET_RACKET_LIBRARY="$racket_library"
          export RIVET_RACKET_BOOT_DIR="$(dirname "$petite_source")"
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export GTK_A11Y=none
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          xvfb-run -a raco rivet release --development
          rm -f "$KEY_DER"

      - name: Collect release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/syncpilot-${version}-linux-x64.tar.gz"
          test -f dist/update-stable.json
          # hash under dist/ so the checksum file carries the bare asset
          # name and `sha256sum --check` works beside the downloaded files
          (cd dist && sha256sum "syncpilot-${version}-linux-x64.tar.gz") \
            > "syncpilot-${version}-linux-x64.tar.gz.sha256"
          sha256sum --check "syncpilot-${version}-linux-x64.tar.gz.sha256" \
            && test "$(sha256sum "dist/syncpilot-${version}-linux-x64.tar.gz" | awk '{print $1}')" \
                 = "$(awk '{print $1}' "syncpilot-${version}-linux-x64.tar.gz.sha256")"
          mv "dist/syncpilot-${version}-linux-x64.tar.gz" .
          mv dist/update-stable.json .
          ls -la

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "SyncPilot ${version}" \
            --generate-notes \
            "syncpilot-${version}-linux-x64.tar.gz" \
            "syncpilot-${version}-linux-x64.tar.gz.sha256" \
            update-stable.json
