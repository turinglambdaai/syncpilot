name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential
      - name: Extract changelog for the release body
        id: cl
        run: |
          ver="${GITHUB_REF_NAME#v}"
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="$ver" '
              /^## \[/ {
                if (found) exit;
                found = (index($0, "[" ver "]") > 0);
                next
              }
              found { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SyncPilot ${{ github.ref_name }}"
          releaseBody: ${{ steps.cl.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Checksums
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec sha256sum {} \; | sed "s|\./||" > checksums-${{ matrix.target }}.txt
          cat checksums-${{ matrix.target }}.txt
          gh release upload "$GITHUB_REF_NAME" checksums-${{ matrix.target }}.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
